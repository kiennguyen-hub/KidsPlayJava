// Top-level build file
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.3'
        // Plugin đọc google-services.json. Bản 4.5.0 tương thích AGP 9 (bản cũ có thể lỗi).
        classpath 'com.google.gms:google-services:4.5.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
